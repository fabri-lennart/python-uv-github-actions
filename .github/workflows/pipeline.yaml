name: initiial-pipeline-ci 
  on:
    push:
      branches:
       - feature/github-actions-dependencies
       - develop
       - main

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/Checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verificar sintaxis y formato
        run: uv run ruff check .

  run-pipeline:
    runs-on: ubuntu-latest
    needs: linter

    steps:
      - name: Checkout code
        uses: actions/Checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run data script
        run: uv run python main.py
